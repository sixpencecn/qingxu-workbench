<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7faf9">
  <meta name="description" content="轻序 — 轻量化的个人综合管理工作台，日程、待办、打卡、专注、记账一站管理，支持离线安装。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="轻序">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>轻序 · 个人综合管理工作台</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div id="app">
    <div class="sidebar-overlay" id="sidebarOverlay" hidden></div>
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="brand-text"><strong>轻序</strong><small>个人管理工作台</small></div>
      </div>
      <nav class="side-nav" id="sideNav" aria-label="主导航"></nav>
      <div class="side-foot">
        <div class="side-foot-line"></div>
        <span>数据仅保存在本机浏览器</span>
      </div>
    </aside>

    <div class="main-wrap">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="打开菜单" data-icon="menu"></button>
        <div class="page-heading">
          <h1 id="pageTitle">概览</h1>
          <p id="pageSubtitle"></p>
        </div>
        <div class="topbar-right">
          <span class="date-chip" id="dateChip"></span>
          <button class="icon-btn" id="topSettings" type="button" aria-label="数据备份与设置" data-icon="database"></button>
        </div>
      </header>
      <main class="view" id="view" tabindex="-1"></main>
    </div>

    <nav class="bottom-nav" id="bottomNav" aria-label="底部导航"></nav>
    <div id="modalRoot"></div>
    <div id="toastRoot" class="toast-root" aria-live="polite"></div>
    <div id="installBanner" class="install-banner" hidden>
      <div class="install-banner-text"><strong>安装到桌面</strong><small>离线可用，像 App 一样打开</small></div>
      <button class="btn btn-primary btn-sm" id="installBtn" type="button">安装</button>
      <button class="icon-btn btn-sm" id="installClose" type="button" aria-label="关闭" data-icon="x"></button>
    </div>
  </div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
